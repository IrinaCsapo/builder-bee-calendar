name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      indexnow_all:
        description: 'Also send every page to IndexNow (Bing and others)'
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Resized event pictures from earlier builds (scripts/optimise-images.ts), so only new ones are fetched
      - uses: actions/cache@v4
        with:
          path: .image-cache
          key: event-images-${{ hashFiles('src/data/events.json') }}
          restore-keys: event-images-
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Tell Bing and other IndexNow search engines which pages changed (new or edited events)
  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    continue-on-error: true   # never fail the deploy over this
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Send changed pages
        env:
          BEFORE: ${{ github.event.before }}
          ALL: ${{ inputs.indexnow_all }}
        run: |
          if [ "$ALL" = "true" ]; then npx tsx scripts/indexnow.ts all
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then npx tsx scripts/indexnow.ts "$BEFORE"
          else echo "No earlier commit to compare with; nothing sent"; fi
